<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>战斗入场 · Rumble Core</title>
<style>/*@@CSS@@*/</style>
</head>
<body>
<main>
  <header class="top"><span class="brand"><i></i> COBBLEMON / RUMBLE CORE</span><span class="build">MOTION STUDY <b>01</b></span></header>
  <section class="heading"><p class="eyebrow">RUMBLE ARENA &nbsp; / &nbsp; VERSUS INTRO</p><h1>战斗入场<span>.</span></h1><p>半身对峙 · 镜头演示</p></section>
  <nav id="matchups" aria-label="对战组合">
    <button data-mode="0" aria-pressed="false"><small>01</small> 玩家 vs NPC</button>
    <button data-mode="1" aria-pressed="false"><small>02</small> 玩家 vs 玩家</button>
    <button data-mode="2" aria-pressed="false"><small>03</small> 玩家 vs 宝可梦</button>
    <button data-mode="3" aria-pressed="true"><small>04</small> 宝可梦 vs 宝可梦</button>
  </nav>
  <section id="stage" class="stage" aria-label="三维入场动画预览" data-phase="ready">
    <div class="plate l"></div><div class="plate r"></div><div class="strike"></div>
    <div class="ghost l" id="ghost0"></div><div class="ghost r" id="ghost1"></div>
    <div id="view" aria-hidden="true"></div><div class="shade"></div>
    <div class="viewport-top"><span><i></i> ARENA FEED <b>01</b></span><span id="phase">STANDBY</span></div>
    <div class="versus" id="versus"><span>FACE OFF</span><strong>VS</strong><span>ROUND 01</span></div>
    <div class="versus fight" id="fight"><span>ROUND 01</span><strong>FIGHT<span>!</span></strong></div>
    <div class="name l" id="card0"><small id="kind0"></small><strong id="name0"></strong><em id="en0"></em></div>
    <div class="name r" id="card1"><small id="kind1"></small><strong id="name1"></strong><em id="en1"></em></div>
    <div id="flash" class="flash" aria-hidden="true"></div>
    <p id="error" role="alert" hidden></p>
  </section>
  <section class="transport" aria-label="播放控制">
    <button id="replay" class="primary" disabled>↻ &nbsp;重播</button><button id="play" disabled>▶ &nbsp;播放</button>
    <div class="timeline"><label for="seek">时间轴</label><input id="seek" type="range" min="0" max="5.4" step="0.01" value="0" disabled><output id="time" for="seek">0.00 / 5.40</output></div>
    <button id="sound" aria-pressed="false">声音：关</button>
  </section>
  <footer><span>01 / 双方入镜 · 02 / 对峙吼叫 · 03 / 开战</span><span><kbd>SPACE</kbd> 播放 / 暂停 &nbsp; <kbd>R</kbd> 重播</span></footer>
</main>
<script>/*@@THREE@@*/</script>
<script type="application/json" id="assets">/*@@ASSETS@@*/</script>
<script>/*@@APP@@*/</script>
</body></html>
